<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${detail.title + ' — Murabel'})}"></head>
<body class="page-detail">

<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>

<main>
    <div class="detail-hero"
         th:style="${detail.backdropPath != null} ? 'background-image:url(https://image.tmdb.org/t/p/w1280' + ${detail.backdropPath} + ')' : ''">
        <div class="detail-hero-overlay"></div>
        <div class="container detail-hero-inner">
            <img class="detail-poster"
                 th:if="${detail.posterPath != null}"
                 th:src="'https://image.tmdb.org/t/p/w342' + ${detail.posterPath}"
                 th:alt="${detail.title}">
            <div class="detail-poster detail-poster-placeholder" th:if="${detail.posterPath == null}"></div>
            <div class="detail-info">
                <span class="media-type-badge">영화</span>
                <h1 class="detail-title" th:text="${detail.title}">제목</h1>
                <p class="detail-original-title" th:if="${detail.originalTitle != null and detail.originalTitle != detail.title}"
                   th:text="${detail.originalTitle}"></p>
                <div class="detail-meta">
                    <span th:if="${detail.releaseDate != null and !detail.releaseDate.isEmpty()}"
                          th:text="${#strings.substring(detail.releaseDate, 0, 4)}"></span>
                    <span th:if="${detail.runtime != null}" th:text="${detail.runtime + '분'}"></span>
                </div>
                <div class="detail-genres" th:if="${!#lists.isEmpty(detail.genres)}">
                    <span class="detail-genre" th:each="g : ${detail.genres}" th:text="${g.name}"></span>
                </div>
                <div class="detail-murabel-rating">
                    <div class="rating-badge-external rating-murabel">
                        <span class="rating-source">무라벨</span>
                        <span class="rating-star">★</span>
                        <span class="rating-value" th:text="${#numbers.formatDecimal(murabelAvg, 1, 1)}"></span>
                        <span class="rating-count" th:text="'(' + ${#lists.size(records)} + ')'"></span>
                    </div>
                </div>
                <div class="detail-all-ratings">
                    <div class="rating-badge-external rating-tmdb" th:if="${detail.voteAverage != null}">
                        <span class="rating-source">TMDB</span>
                        <span class="rating-star">★</span>
                        <span class="rating-value" th:text="${#numbers.formatDecimal(detail.voteAverage, 1, 1)}"></span>
                        <span class="rating-count" th:if="${detail.voteCount != null}"
                              th:text="'(' + ${#numbers.formatInteger(detail.voteCount, 1, 'COMMA')} + ')'"></span>
                    </div>
                    <div th:each="r : ${omdbRatings}" class="rating-badge-external" th:classappend="${r.cssClass}">
                        <span class="rating-source" th:text="${r.source == 'Rotten Tomatoes' ? '🍅' : r.source}"></span>
                        <span class="rating-value" th:text="${r.value}"></span>
                        <span class="rating-emoji" th:if="${r.emoji != null}" th:text="${r.emoji}"></span>
                    </div>
                </div>
                <p class="detail-tagline" th:if="${detail.tagline != null and !detail.tagline.isEmpty()}"
                   th:text="${detail.tagline}"></p>
            </div>
        </div>
    </div>

    <div class="container detail-body">
        <section class="detail-overview" th:if="${detail.overview != null and !detail.overview.isEmpty()}">
            <h2>줄거리</h2>
            <p th:text="${detail.overview}"></p>
        </section>

        <section class="detail-records">
            <div class="detail-records-header">
                <h2>감상평 <span class="records-count" th:text="'(' + ${#lists.size(records)} + ')'"></span></h2>
                <a th:href="@{/records/new(tmdbId=${detail.id}, mediaType='movie', title=${detail.title}, posterPath=${detail.posterPath})}"
                   class="btn btn-primary btn-sm" sec:authorize="isAuthenticated()">감상평 남기기</a>
                <a th:href="@{/auth/login}" class="btn btn-primary btn-sm"
                   sec:authorize="!isAuthenticated()">감상평 남기기</a>
            </div>
            <div th:if="${#lists.isEmpty(records)}" class="empty-state-small">
                <p>아직 감상평이 없습니다. 첫 번째 감상평을 남겨보세요!</p>
            </div>
            <div class="records-list" th:if="${!#lists.isEmpty(records)}">
                <a th:each="r : ${records}" th:href="@{/records/{id}(id=${r.id})}" class="record-card">
                    <div class="record-card-header">
                        <span class="record-card-user" th:text="${r.user.displayNickname}"></span>
                        <span class="record-card-date" th:text="${#temporals.format(r.watchedDate, 'yyyy.MM.dd')}"></span>
                        <span class="record-card-rating" th:text="'★ ' + ${r.rating}"></span>
                    </div>
                    <p class="record-card-oneliner" th:if="${r.oneLiner != null}" th:text="${r.oneLiner}"></p>
                </a>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
