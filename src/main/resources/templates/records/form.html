<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${mode == 'edit'} ? '감상평 수정 — Murabel' : '감상평 등록 — Murabel', ~{::#extra-head})}">
    <th:block id="extra-head">
        <link rel="stylesheet" th:href="@{/css/records.css}">
    </th:block>
</head>
<body class="page-form">

<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container">
    <div class="detail-header">
        <a th:href="@{/records}" class="back-link">← 목록으로</a>
    </div>

    <div class="form-card">
        <h1 class="form-title" th:text="${mode == 'edit'} ? '감상평 수정' : '감상평 등록'">감상평 등록</h1>

        <form class="form"
              th:action="${mode == 'edit'} ? @{/records/{id}(id=${movieId})} : @{/records}"
              th:object="${movieForm}"
              method="post">

            <div class="form-group">
                <label for="title">제목 <span class="required">*</span></label>
                <div class="tmdb-search-wrap">
                    <input type="text" id="title" th:field="*{title}" class="form-control"
                           maxlength="200" required autocomplete="off" placeholder="영화 또는 드라마 제목을 입력하세요">
                    <div id="tmdbDropdown" class="tmdb-dropdown" hidden></div>
                </div>
                <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </div>
            <div class="form-group">
                <label>포스터</label>
                <div id="thumbPreview" class="thumb-preview"
                     th:style="${existingThumbnailUrl != null} ? 'background-image:url(' + ${existingThumbnailUrl} + ')' : ''"
                     th:text="${existingThumbnailUrl == null} ? '포스터 없음' : ''"></div>
                <input type="hidden" id="tmdbId" th:field="*{tmdbId}">
                <input type="hidden" id="mediaType" th:field="*{mediaType}">
                <input type="hidden" id="posterPath" th:field="*{posterPath}">
            </div>

            <div class="form-group form-group-date">
                <label for="watchedDate">감상일 <span class="required">*</span></label>
                <input type="date" id="watchedDate" th:field="*{watchedDate}" class="form-control" required>
                <span class="field-error" th:if="${#fields.hasErrors('watchedDate')}" th:errors="*{watchedDate}"></span>
            </div>

            <div class="form-group">
                <label for="oneLiner">한줄평</label>
                <textarea id="oneLiner" th:field="*{oneLiner}" class="form-control"
                          maxlength="1000" data-counter="oneLinerCount"
                          placeholder="이 작품을 한 줄로 표현한다면?"></textarea>
                <div class="char-counter"><span id="oneLinerCount">0</span>/1000</div>
                <span class="field-error" th:if="${#fields.hasErrors('oneLiner')}" th:errors="*{oneLiner}"></span>
            </div>

            <div class="form-group">
                <label>몰입감 <span class="required">*</span></label>
                <div class="chip-group">
                    <label th:each="opt : ${immersionOptions}" class="chip-label">
                        <input type="radio" th:field="*{immersion}" th:value="${opt}">
                        <span class="chip" th:text="${opt.displayName}"></span>
                    </label>
                </div>
                <span class="field-error" th:if="${#fields.hasErrors('immersion')}" th:errors="*{immersion}"></span>
            </div>

            <div class="form-group">
                <label>스토리 <span class="required">*</span></label>
                <div class="chip-group">
                    <label th:each="opt : ${storyOptions}" class="chip-label">
                        <input type="radio" th:field="*{story}" th:value="${opt}">
                        <span class="chip" th:text="${opt.displayName}"></span>
                    </label>
                </div>
                <span class="field-error" th:if="${#fields.hasErrors('story')}" th:errors="*{story}"></span>
            </div>

            <div class="form-group">
                <label>감정 <span class="required">*</span> <small>(중복 선택 가능)</small></label>
                <div class="chip-group">
                    <label th:each="opt : ${emotionOptions}" class="chip-label">
                        <input type="checkbox" th:field="*{emotions}" th:value="${opt}">
                        <span class="chip" th:text="${opt.displayName}" th:attr="data-emo=${opt.getCode()}"></span>
                    </label>
                </div>
                <span class="field-error" th:if="${#fields.hasErrors('emotions')}" th:errors="*{emotions}"></span>
            </div>

            <div class="form-group">
                <label for="goodPoints">좋았던 점</label>
                <textarea id="goodPoints" th:field="*{goodPoints}" class="form-control"
                          maxlength="1000" data-counter="goodCount"
                          placeholder="인상 깊었던 장면, 대사, 연출 등을 자유롭게 적어보세요."></textarea>
                <div class="char-counter"><span id="goodCount">0</span>/1000</div>
                <span class="field-error" th:if="${#fields.hasErrors('goodPoints')}" th:errors="*{goodPoints}"></span>
            </div>

            <div class="form-group">
                <label for="badPoints">아쉬웠던 점</label>
                <textarea id="badPoints" th:field="*{badPoints}" class="form-control"
                          maxlength="1000" data-counter="badCount"
                          placeholder="조금 더 나았으면 했던 부분을 적어보세요."></textarea>
                <div class="char-counter"><span id="badCount">0</span>/1000</div>
                <span class="field-error" th:if="${#fields.hasErrors('badPoints')}" th:errors="*{badPoints}"></span>
            </div>

            <div class="form-group">
                <label>내 취향 <span class="required">*</span></label>
                <div class="chip-group">
                    <label th:each="opt : ${tasteOptions}" class="chip-label">
                        <input type="radio" th:field="*{taste}" th:value="${opt}">
                        <span class="chip" th:text="${opt.displayName}"></span>
                    </label>
                </div>
                <span class="field-error" th:if="${#fields.hasErrors('taste')}" th:errors="*{taste}"></span>
            </div>

            <div class="form-group">
                <label>별점 <span class="required">*</span></label>
                <div class="star-rating">
                    <div class="stars-wrap" id="starRating">
                        <span class="stars-bg"></span>
                        <span class="stars-fg" id="starsFg"></span>
                        <span class="star-slot" data-value="0.5" style="left:0%;   width:10%"></span>
                        <span class="star-slot" data-value="1.0" style="left:10%;  width:10%"></span>
                        <span class="star-slot" data-value="1.5" style="left:20%;  width:10%"></span>
                        <span class="star-slot" data-value="2.0" style="left:30%;  width:10%"></span>
                        <span class="star-slot" data-value="2.5" style="left:40%;  width:10%"></span>
                        <span class="star-slot" data-value="3.0" style="left:50%;  width:10%"></span>
                        <span class="star-slot" data-value="3.5" style="left:60%;  width:10%"></span>
                        <span class="star-slot" data-value="4.0" style="left:70%;  width:10%"></span>
                        <span class="star-slot" data-value="4.5" style="left:80%;  width:10%"></span>
                        <span class="star-slot" data-value="5.0" style="left:90%;  width:10%"></span>
                    </div>
                    <span class="rating-value" id="ratingValue">0.0</span>
                    <input type="hidden" th:field="*{rating}" id="ratingInput">
                </div>
                <span class="field-error" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></span>
            </div>

            <div class="form-actions">
                <a class="btn btn-secondary" th:href="@{/records}">취소</a>
                <button type="submit" class="btn btn-primary"
                        th:text="${mode == 'edit'} ? '수정 완료' : '등록하기'">등록하기</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

<script th:src="@{/js/form.js}"></script>
<script th:src="@{/js/tmdb-search.js}"></script>
</body>
</html>
