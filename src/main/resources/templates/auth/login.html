<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>로그인</title>
</head>
<body>
<section>
    <style>
        body { background-color: #0c0b18; }
        main.container { padding-top: 0; padding-bottom: 0; }
        .site-header {
            background-color: #100f1c;
            border-bottom: 1px solid rgba(232, 184, 75, 0.1);
        }
        .brand { color: #e8b84b !important; }
        .site-footer {
            background-color: #0c0b18;
            border-top: 1px solid rgba(232, 184, 75, 0.06);
            margin-top: 0;
        }
        .site-footer small { color: rgba(240, 235, 224, 0.2); }
    </style>

    <div class="auth-scene">
        <div class="auth-container">

            <div class="auth-brand">
                <div class="film-icon">🎬</div>
            </div>

            <div class="film-strip">
                <span class="film-hole"></span>
                <span class="film-hole"></span>
                <span class="film-hole"></span>
                <span class="film-hole"></span>
                <span class="film-hole"></span>
                <span class="film-hole"></span>
                <span class="film-hole"></span>
                <span class="film-hole"></span>
            </div>

            <h2 class="auth-title">다시 돌아오셨군요</h2>
            <p class="auth-subtitle">당신의 영화 기록이 기다리고 있어요</p>

            <div th:if="${param.error}" class="flash-message error">
                아이디 또는 비밀번호가 올바르지 않습니다.
            </div>
            <div th:if="${param.logout}" class="flash-message">
                로그아웃되었습니다.
            </div>
            <div th:if="${param.signupSuccess}" class="flash-message">
                회원가입이 완료되었습니다. 로그인해주세요.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username"
                           class="form-control" autofocus autocomplete="username"
                           placeholder="아이디를 입력하세요">
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password"
                           class="form-control" autocomplete="current-password"
                           placeholder="비밀번호를 입력하세요">
                </div>
                <button type="submit" class="btn btn-primary btn-block">로그인</button>
            </form>

            <p class="auth-link">처음 방문하셨나요? <a th:href="@{/auth/signup}">회원가입</a></p>
        </div>
    </div>
</section>
</body>
</html>
