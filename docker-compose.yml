x-awslogs-opts: &awslogs-opts
  awslogs-region: ap-northeast-2
  awslogs-create-group: "true"
  mode: non-blocking
  max-buffer-size: 4m

services:
  app:
    build: .
    container_name: movierecord-app
    restart: always
    logging:
      driver: awslogs
      options:
        <<: *awslogs-opts
        awslogs-group: /movierecord/app
        awslogs-stream: app
        awslogs-multiline-pattern: '^\d{4}-\d{2}-\d{2}'
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
      - "9090"          # actuator 관리 포트 — 내부 네트워크 전용(host publish 안 함)
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./uploads:/app/uploads

  mysql:
    image: mysql:8.4
    container_name: movierecord-mysql
    restart: always
    logging:
      driver: awslogs
      options:
        <<: *awslogs-opts
        awslogs-group: /movierecord/mysql
        awslogs-stream: mysql
    env_file:
      - .env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:stable
    container_name: movierecord-nginx
    restart: always
    logging:
      driver: awslogs
      options:
        <<: *awslogs-opts
        awslogs-group: /movierecord/nginx
        awslogs-stream: nginx
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      # HTTPS 붙일 때 사용
      # - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/app/uploads:ro
      - ./docker/certbot/www:/var/www/certbot:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro

  redis:
    image: redis:8.6.3-alpine
    container_name: movie-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    logging:
      driver: awslogs
      options:
        <<: *awslogs-opts
        awslogs-group: /movierecord/redis
        awslogs-stream: redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
