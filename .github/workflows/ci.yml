name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # wrapper 검증(기본 활성)과 의존성·wrapper 캐시. PR 브랜치는 master 캐시를 읽기만 한다.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Test
        run: ./gradlew test

      # 테스트가 실패해도 리포트를 남긴다.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore

      - name: Build bootJar
        run: ./gradlew bootJar

      # Dockerfile이 현재 소스로 빌드되는지만 확인한다. 테스트는 위 단계에서 끝났으므로 -x test 유지, push 없음.
      - name: Docker build (no push)
        run: docker build -t movierecord:ci .
