<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('가입 승인 관리 — Murabel')}"></head>
<body class="page-admin">

<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container">
    <div class="admin-container">
        <h2 class="admin-title">회원 관리</h2>

        <div class="admin-tabs">
            <a th:href="@{/admin/members}" class="admin-tab">회원 목록</a>
            <a th:href="@{/admin/users}" class="admin-tab active">승인 대기</a>
        </div>

        <div th:if="${#lists.isEmpty(pendingUsers)}" class="empty-msg">
            승인 대기 중인 회원이 없습니다.
        </div>

        <table th:if="${!#lists.isEmpty(pendingUsers)}" class="user-table">
            <thead>
                <tr>
                    <th>이름</th>
                    <th>아이디</th>
                    <th>가입 일시</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${pendingUsers}">
                    <td th:text="${user.name}"></td>
                    <td th:text="${user.username}"></td>
                    <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <form th:action="@{/admin/users/{id}/approve(id=${user.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="approve-btn">승인</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
