<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title, extraHead)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Murabel'">Murabel</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/webjars/swiper/swiper-bundle.min.css}">
    <link rel="icon" type="image/png" th:href="@{/images/murabel_logo.png}">
    <script th:src="@{/js/header-search.js}" defer></script>
    <script th:src="@{/js/drawer.js}" defer></script>
    <th:block th:if="${extraHead != null}" th:replace="${extraHead}"></th:block>
</head>
<body>

<th:block th:fragment="header">
<header class="site-header">
    <div class="container header-inner">
        <div class="header-left">
            <button class="menu-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="side-drawer">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <a th:href="@{/}" class="brand">
                <img th:src="@{/images/murabel_logo.png}" alt="Murabel" class="brand-logo">
            </a>
        </div>
        <div class="header-search" id="header-search">
            <input type="text" id="header-search-input" class="header-search-input"
                   placeholder="영화, TV, 인물 검색..." autocomplete="off" aria-label="검색">
            <button type="button" class="header-search-btn" id="header-search-btn" aria-label="검색">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>
            <div class="header-search-dropdown" id="header-search-dropdown" hidden></div>
        </div>
        <div class="header-user" sec:authorize="isAuthenticated()">
            <span class="header-username" sec:authentication="principal.displayNickname"></span>
            <a th:href="@{/my-page}" class="btn btn-ghost btn-sm">마이페이지</a>
            <a th:href="@{/admin/members}" class="btn btn-ghost btn-sm" sec:authorize="hasRole('ADMIN')">관리자 페이지</a>
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit" class="btn btn-secondary btn-sm">로그아웃</button>
            </form>
            <a th:href="@{/my-page}" class="header-avatar"
               th:text="${#strings.substring(#authentication.principal.displayNickname, 0, 1).toUpperCase()}">U</a>
        </div>
        <div class="header-user" sec:authorize="!isAuthenticated()">
            <a th:href="@{/auth/login}" class="btn btn-secondary btn-sm header-login-btn">로그인</a>
        </div>
    </div>
</header>

<div class="drawer-overlay" aria-hidden="true"></div>
<aside id="side-drawer" class="side-drawer" role="dialog" aria-modal="true" aria-label="사이트 메뉴">
    <div class="drawer-header">
        <span class="drawer-title">메뉴</span>
        <button class="drawer-close" aria-label="메뉴 닫기">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
    </div>
    <nav class="drawer-nav" aria-label="사이트 탐색">
        <a th:href="@{/my-page}" class="drawer-link" sec:authorize="isAuthenticated()"
           th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/my-page')} ? ' active'">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-icon lucide-user">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            마이페이지
        </a>
        <a th:href="@{/}" class="drawer-link"
           th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/'} ? ' active'">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house-icon lucide-house" aria-hidden="true">
                <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
                <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>
            홈
        </a>
        <a th:href="@{/records}" class="drawer-link"
           th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/records')} ? ' active'">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-message-square-text-icon lucide-message-square-text">
                <path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/>
                <path d="M7 11h10"/>
                <path d="M7 15h6"/>
                <path d="M7 7h8"/>
            </svg>
            감상평
        </a>
    </nav>
</aside>

<nav class="tab-bar">
    <div class="tab-bar-inner">
        <button type="button" class="tab-link menu-toggle" aria-controls="side-drawer" aria-expanded="false" aria-label="메뉴 열기">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu-icon lucide-menu">
                <path d="M4 5h16"/>
                <path d="M4 12h16"/>
                <path d="M4 19h16"/>
            </svg>
            <span class="label">메뉴</span>
        </button>

        <a th:href="@{/}" class="tab-link"
           th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/records') and not #strings.startsWith(#httpServletRequest.requestURI, '/records/new')} ? ' active'">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house-icon lucide-house" aria-hidden="true">
                <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
                <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>
            <span class="label">홈</span>
        </a>

        <a th:href="@{/records}" class="tab-link"
           th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/records') and not #strings.startsWith(#httpServletRequest.requestURI, '/records/new')} ? ' active'">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-message-square-text-icon lucide-message-square-text">
                <path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/>
                <path d="M7 11h10"/>
                <path d="M7 15h6"/>
                <path d="M7 7h8"/>
            </svg>
            <span class="label">감상평</span>
        </a>
<!--        <a th:href="@{/records/new}" class="tab-link tab-add">-->
<!--            <span class="tab-add-circle">-->
<!--                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">-->
<!--                    <path d="M12 5v14M5 12h14"/>-->
<!--                </svg>-->
<!--            </span>-->
<!--            <span class="label">기록</span>-->
<!--        </a>-->
        <a th:href="@{/my-page}" class="tab-link"
           th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/my-page')} ? ' active'">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-icon lucide-user">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            <span class="label">마이페이지</span>
        </a>
    </div>
</nav>
</th:block>

<footer th:fragment="footer" class="site-footer">
    <div class="tmdb-attribution">
        <img src="/images/tmdb-logo.svg" alt="TMDB" style="height: 20px;">
        <p>
            이 서비스는 TMDB API를 사용하지만, TMDB의 공식 인증이나 승인을 받은 서비스는 아닙니다.
        </p>
        <p>
            This product uses the TMDB API but is not endorsed or certified by TMDB.
        </p>
    </div>

    <div class="container">
        <small>&copy; potatoCompletion</small>
    </div>
</footer>

<div th:fragment="flash">
    <div th:if="${success}" class="flash-message" th:text="${success}"></div>
    <div th:if="${error}" class="flash-message error" th:text="${error}"></div>
    <div th:if="${info}" class="flash-message" th:text="${info}"></div>
</div>

</body>
</html>
