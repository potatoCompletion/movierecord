<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('서버 오류 — Murabel', ~{})}"></head>
<body class="page-error">

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <div class="error-scene">
        <div class="error-card">
            <div style="font-family:var(--font-display);color:var(--fg-dim);letter-spacing:0.2em;font-size:0.78rem;margin-bottom:0.5rem">TECHNICAL DIFFICULTIES</div>
            <h1 class="error-code">500</h1>
            <h2 class="error-title">잠시 후 상영이 재개됩니다</h2>
            <p class="error-desc">
                서버에 문제가 생겼어요.<br>
                곧 다시 시도해주시면 정상적으로 동작할 거예요.
            </p>
            <div class="error-actions">
                <a class="btn btn-primary" th:href="@{/records}">홈으로</a>
                <a class="btn btn-secondary" href="javascript:location.reload()">새로고침</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
