<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Murabel')}"></head>
<body class="page-home">

<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container">

    <section class="boxoffice-section" th:if="${!#lists.isEmpty(boxOffice)}" aria-label="박스오피스 TOP 10">
        <h2 class="boxoffice-heading">박스오피스 TOP 10</h2>
        <div class="swiper boxoffice-swiper">
            <div class="swiper-wrapper">
                <a class="swiper-slide boxoffice-card"
                   th:each="item : ${boxOffice}"
                   th:href="${item.tmdbId != null} ? ${'/' + item.mediaType + '/' + item.tmdbId} : null"
                   th:classappend="${item.tmdbId != null} ? ' boxoffice-card--linked'">
                    <div class="boxoffice-poster"
                         th:style="${item.posterUrl != null} ? 'background-image:url(' + ${item.posterUrl} + ')' : ''">
                    </div>
                    <div class="boxoffice-rank-row">
                        <span class="boxoffice-rank" th:text="${item.rank}">1</span>
                        <span class="boxoffice-audi" th:if="${item.audiAcc != null}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="10" height="10" fill="currentColor" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span th:text="${#numbers.formatInteger(item.audiAcc, 1, 'COMMA')}">0</span></span>
                    </div>
                    <span class="boxoffice-title" th:text="${item.movieNm}">영화제목</span>
                </a>
            </div>
        </div>
    </section>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

<script th:src="@{/webjars/swiper/swiper-bundle.min.js}"></script>
<script>
    (function () {
        const el = document.querySelector('.boxoffice-swiper');
        if (!el) return;
        const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        new Swiper(el, {
            slidesPerView: 'auto',
            spaceBetween: 12,
            loop: true,
            grabCursor: true,
            speed: 3000,
            freeMode: { enabled: true, momentum: false },
            autoplay: prefersReduced ? false : {
                delay: 0,
                disableOnInteraction: false,
                pauseOnMouseEnter: true,
            },
        });
    })();
</script>

</body>
</html>
