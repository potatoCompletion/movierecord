<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입 — Murabel', ~{::#extra-head})}">
    <th:block id="extra-head">
        <link rel="stylesheet" th:href="@{/css/auth.css}">
    </th:block>
</head>
<body class="page-auth">

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <div class="auth-scene">
        <div class="auth-container">
            <div class="auth-brand">
                <img th:src="@{/images/murabel_logo.png}" alt="Murabel" class="auth-logo">
            </div>
            <div class="film-strip">
                <span class="film-hole"></span><span class="film-hole"></span><span class="film-hole"></span>
                <span class="film-hole"></span><span class="film-hole"></span><span class="film-hole"></span>
                <span class="film-hole"></span><span class="film-hole"></span>
            </div>
            <h2 class="auth-title">새로운 여정의 시작</h2>
            <p class="auth-subtitle">나만의 영화 기록을 시작해보세요</p>

            <form th:action="@{/auth/signup}" th:object="${signupForm}" method="post">
                <div class="form-group">
                    <label for="name">이름</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control"
                           placeholder="실명을 입력하세요" autofocus autocomplete="name">
                    <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                </div>
                <div class="form-group">
                    <label for="username">아이디</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control"
                           placeholder="사용할 아이디를 입력하세요" autocomplete="username">
                    <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control"
                           placeholder="비밀번호를 입력하세요" autocomplete="new-password">
                    <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>
                <div class="form-group">
                    <label for="passwordConfirm">비밀번호 확인</label>
                    <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}" class="form-control"
                           placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password">
                    <span class="field-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-block">회원가입</button>
            </form>

            <p class="auth-link">이미 계정이 있으신가요? <a th:href="@{/auth/login}">로그인</a></p>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
