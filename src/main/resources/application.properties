spring.application.name=movierecord
server.port=8080

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.registration.naver.client-name=Naver

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

app.upload.dir=./uploads

tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.image-base-url=https://image.tmdb.org/t/p/w500
tmdb.api.token=${TMDB_API_TOKEN}

kobis.api.key=${KOBIS_API_KEY}

omdb.api.base-url=http://www.omdbapi.com
omdb.api.key=${OMDB_API_KEY}

# ===== resilience4j =====
# 공통 예외 정책: transient(5xx/429/타임아웃)는 재시도/서킷 집계, client(4xx)는 무시.
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=80
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=4s
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.record-exceptions=com.my.movierecord.common.exception.ExternalApiTransientException,org.springframework.web.client.ResourceAccessException
resilience4j.circuitbreaker.configs.default.ignore-exceptions=com.my.movierecord.common.exception.ExternalApiClientException

resilience4j.circuitbreaker.instances.tmdbApi.base-config=default
resilience4j.circuitbreaker.instances.omdbApi.base-config=default
resilience4j.circuitbreaker.instances.kobisApi.base-config=default
resilience4j.circuitbreaker.instances.tmdbImage.base-config=default

resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=300ms
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
resilience4j.retry.configs.default.retry-exceptions=com.my.movierecord.common.exception.ExternalApiTransientException,org.springframework.web.client.ResourceAccessException
resilience4j.retry.configs.default.ignore-exceptions=com.my.movierecord.common.exception.ExternalApiClientException

resilience4j.retry.instances.tmdbApi.base-config=default
resilience4j.retry.instances.omdbApi.base-config=default
resilience4j.retry.instances.kobisApi.base-config=default
resilience4j.retry.instances.tmdbImage.base-config=default

# RateLimiter: API 쿼터 보호. timeout-duration 만큼 허가를 대기한 뒤 초과 시 실패.
resilience4j.ratelimiter.configs.default.limit-refresh-period=1s
resilience4j.ratelimiter.configs.default.timeout-duration=2s
resilience4j.ratelimiter.instances.tmdbApi.base-config=default
resilience4j.ratelimiter.instances.tmdbApi.limit-for-period=40
resilience4j.ratelimiter.instances.omdbApi.limit-refresh-period=24h
resilience4j.ratelimiter.instances.omdbApi.timeout-duration=0
resilience4j.ratelimiter.instances.omdbApi.limit-for-period=900

# Bulkhead: 동시 호출 상한(특히 전송 타임아웃 제어 불가한 KOBIS 자원 격리에 중요).
resilience4j.bulkhead.instances.tmdbApi.max-concurrent-calls=20
resilience4j.bulkhead.instances.tmdbApi.max-wait-duration=100ms
resilience4j.bulkhead.instances.omdbApi.max-concurrent-calls=10
resilience4j.bulkhead.instances.omdbApi.max-wait-duration=100ms
resilience4j.bulkhead.instances.kobisApi.max-concurrent-calls=5
resilience4j.bulkhead.instances.kobisApi.max-wait-duration=0
resilience4j.bulkhead.instances.tmdbImage.max-concurrent-calls=10
resilience4j.bulkhead.instances.tmdbImage.max-wait-duration=100ms

# ===== Actuator (resilience4j 상태/메트릭 노출) =====
# prometheus: Micrometer Prometheus 스크레이프 엔드포인트(/actuator/prometheus).
management.endpoints.web.exposure.include=health,prometheus,metrics,circuitbreakers,circuitbreakerevents,retries,ratelimiters,bulkheads
management.health.circuitbreakers.enabled=true
# 메트릭 공통 태그 + HTTP 지연 퍼센타일 히스토그램(Grafana p95/p99 용).
management.metrics.tags.application=movierecord
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# 운영에서는 관리 포트를 분리(9090)해 host에 노출하지 않는다 → application-prod.properties 참고.