<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>회원가입</title>
</head>
<body>
<section>
    <div class="auth-container">
        <h2 class="auth-title">회원가입</h2>

        <form th:action="@{/auth/signup}" th:object="${signupForm}" method="post">
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" th:field="*{username}"
                       class="form-control" autofocus autocomplete="username">
                <span class="field-error" th:if="${#fields.hasErrors('username')}"
                      th:errors="*{username}"></span>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" th:field="*{password}"
                       class="form-control" autocomplete="new-password">
                <span class="field-error" th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}"></span>
            </div>
            <div class="form-group">
                <label for="passwordConfirm">비밀번호 확인</label>
                <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}"
                       class="form-control" autocomplete="new-password">
                <span class="field-error" th:if="${#fields.hasErrors('passwordConfirm')}"
                      th:errors="*{passwordConfirm}"></span>
            </div>
            <button type="submit" class="btn btn-primary btn-block">회원가입</button>
        </form>

        <p class="auth-link">이미 계정이 있으신가요? <a th:href="@{/auth/login}">로그인</a></p>
    </div>
</section>
</body>
</html>
