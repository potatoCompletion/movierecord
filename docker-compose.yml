services:
  app:
    build: .
    container_name: movierecord-app
    restart: always
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - ./uploads:/app/uploads

  mysql:
    image: mysql:8.4
    container_name: movierecord-mysql
    restart: always
    env_file:
      - .env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:stable
    container_name: movierecord-nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      # HTTPS 붙일 때 사용
      # - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/app/uploads:ro
      - ./docker/certbot/www:/var/www/certbot:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro

volumes:
  mysql_data:
