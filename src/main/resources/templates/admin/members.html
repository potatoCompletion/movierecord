<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원 목록 — Murabel', ~{::#extra-head})}">
    <th:block id="extra-head">
        <link rel="stylesheet" th:href="@{/css/admin.css}">
    </th:block>
</head>
<body class="page-admin">

<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container">
    <div class="admin-container">
        <h2 class="admin-title">회원 관리</h2>

        <nav class="admin-tabs">
            <button type="button" class="admin-tab active" onclick="switchTab('members', this)">회원 목록</button>
            <button type="button" class="admin-tab" onclick="switchTab('withdrawn', this)">탈퇴 회원</button>
        </nav>

        <div id="tab-members" class="admin-tab-panel">
            <div th:if="${#lists.isEmpty(users)}" class="empty-msg">
                등록된 회원이 없습니다.
            </div>

            <div th:if="${!#lists.isEmpty(users)}" class="table-scroll">
            <table class="user-table members-table">
                <colgroup>
                    <col class="col-id">
                    <col class="col-nick">
                    <col class="col-name">
                    <col class="col-date">
                    <col class="col-social">
                    <col class="col-login">
                    <col class="col-action">
                </colgroup>
                <thead>
                    <tr>
                        <th>아이디</th>
                        <th>닉네임</th>
                        <th>이름</th>
                        <th>가입일</th>
                        <th>소셜 로그인</th>
                        <th>최근 로그인</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td class="cell-truncate"
                            th:text="${user.username}"
                            th:title="${user.username}"></td>
                        <td class="cell-truncate"
                            th:text="${user.displayNickname}"
                            th:title="${user.displayNickname}"></td>
                        <td class="cell-truncate"
                            th:text="${user.name}"
                            th:title="${user.name}"></td>
                        <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}"></td>
                        <td th:text="${user.provider == 'NAVER' ? '네이버' : (user.provider == 'GOOGLE' ? '구글' : '-')}"></td>
                        <td>
                            <th:block th:if="${user.lastLoginAt != null}">
                                <span th:text="${#temporals.format(user.lastLoginAt, 'yyyy-MM-dd')}"></span><br>
                                <span class="cell-sub" th:text="${#temporals.format(user.lastLoginAt, 'HH:mm:ss')}"></span>
                            </th:block>
                            <th:block th:if="${user.lastLoginAt == null}">-</th:block>
                        </td>
                        <td>
                            <th:block th:if="${user.username == currentUsername}">-</th:block>
                            <div th:if="${user.username != currentUsername}" style="display:flex; justify-content:center; gap:0.4rem;">
                                <form th:if="${user.status.name() == 'PENDING'}"
                                      th:action="@{/admin/members/{id}/approve(id=${user.id})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="approve-btn">승인</button>
                                </form>
                                <form th:action="@{/admin/members/{id}/withdraw(id=${user.id})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit"
                                            class="btn btn-danger btn-sm"
                                            onclick="return confirm('정말 이 회원을 탈퇴 처리하시겠습니까?')">
                                        탈퇴
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            </div>
        </div>

        <div id="tab-withdrawn" class="admin-tab-panel" style="display:none">
            <div th:if="${#lists.isEmpty(withdrawnUsers)}" class="empty-msg">
                탈퇴한 회원이 없습니다.
            </div>

            <div th:if="${!#lists.isEmpty(withdrawnUsers)}" class="table-scroll">
            <table class="user-table members-table">
                <colgroup>
                    <col class="col-id">
                    <col class="col-nick">
                    <col class="col-name">
                    <col class="col-date">
                    <col class="col-social">
                    <col class="col-action">
                </colgroup>
                <thead>
                    <tr>
                        <th>아이디</th>
                        <th>닉네임</th>
                        <th>이름</th>
                        <th>가입일</th>
                        <th>소셜 로그인</th>
                        <th>복구</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${withdrawnUsers}">
                        <td class="cell-truncate"
                            th:text="${user.username}"
                            th:title="${user.username}"></td>
                        <td class="cell-truncate"
                            th:text="${user.displayNickname}"
                            th:title="${user.displayNickname}"></td>
                        <td class="cell-truncate"
                            th:text="${user.name}"
                            th:title="${user.name}"></td>
                        <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}"></td>
                        <td th:text="${user.provider == 'NAVER' ? '네이버' : (user.provider == 'GOOGLE' ? '구글' : '-')}"></td>
                        <td>
                            <form th:action="@{/admin/members/{id}/restore(id=${user.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="approve-btn"
                                        onclick="return confirm('이 회원의 계정을 복구하시겠습니까?')">복구</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

<script>
function switchTab(tab, btn) {
    document.querySelectorAll('.admin-tab-panel').forEach(function(p) { p.style.display = 'none'; });
    document.querySelectorAll('.admin-tab').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('tab-' + tab).style.display = '';
    btn.classList.add('active');
}
</script>
</body>
</html>
