spring.security.oauth2.client.registration.google.client-id=dummy-google-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-google-client-secret

spring.security.oauth2.client.registration.naver.client-id=dummy-naver-client-id
spring.security.oauth2.client.registration.naver.client-secret=dummy-naver-client-secret
spring.security.oauth2.client.registration.naver.provider=naver

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# 테스트 DB: Flyway V1 로 스키마를 만들고 Hibernate 가 검증한다. MODE=MySQL 이어야 마이그레이션 SQL 이 H2 에서 실행된다.
# 컨텍스트마다 다른 이름의 인메모리 DB 를 써서 컨텍스트 간 데이터가 섞이지 않게 한다.
# ${random.uuid} 는 읽을 때마다 새 값이므로 이 URL 은 DataSource 바인딩 한 곳에서만 읽어야 한다(spring.flyway.url 등을 따로 두지 말 것).
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# @DataJpaTest 가 위 URL 을 무시하고 MODE 없는 임베디드 DB 로 바꾸지 않게 한다.
spring.test.database.replace=none

tmdb.api.token=dummy-tmdb-token
kobis.api.key=dummy-kobis-key
omdb.api.key=dummy-omdb-key

# 테스트 전용 JWT 시크릿(HS256 최소 32바이트) 및 비-Secure 쿠키.
app.jwt.secret=test-secret-key-for-jwt-signing-1234567890
app.jwt.access-token-ttl-seconds=900
app.jwt.refresh-token-ttl-seconds=1209600
app.cookie.secure=false
