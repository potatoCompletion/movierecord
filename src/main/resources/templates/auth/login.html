<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인 — Murabel', ~{::#extra-head})}">
    <th:block id="extra-head">
        <link rel="stylesheet" th:href="@{/css/auth.css}">
    </th:block>
</head>
<body class="page-auth">

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <div class="auth-scene">
        <div class="auth-container">
            <div class="auth-brand">
                <img th:src="@{/images/murabel_logo.png}" alt="Murabel" class="auth-logo">
            </div>
            <div class="film-strip">
                <span class="film-hole"></span><span class="film-hole"></span><span class="film-hole"></span>
                <span class="film-hole"></span><span class="film-hole"></span><span class="film-hole"></span>
                <span class="film-hole"></span><span class="film-hole"></span>
            </div>
            <h2 class="auth-title">다시 돌아오셨군요</h2>
            <p class="auth-subtitle">당신의 영화 기록이 기다리고 있어요</p>

            <div th:if="${param.error}" class="flash-message error">
                아이디 또는 비밀번호가 올바르지 않습니다.
            </div>
            <div th:if="${param.disabled}" class="flash-message error">
                승인 대기 상태입니다. 관리자가 가입을 승인할 때까지 기다려주세요.
            </div>
            <div th:if="${param.withdrawn}" class="flash-message error">
                탈퇴 처리된 계정입니다. 이용이 불가합니다.
            </div>
            <div th:if="${param.logout}" class="flash-message">
                로그아웃되었습니다.
            </div>
            <div th:if="${param.signupSuccess}" class="flash-message">
                회원가입 신청이 완료되었습니다. 관리자 승인 후 로그인하실 수 있습니다.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username" class="form-control"
                           placeholder="아이디를 입력하세요" autofocus autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="비밀번호를 입력하세요" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">로그인</button>
            </form>

            <div class="social-divider"><span>또는 소셜 계정으로 로그인</span></div>

            <div class="social-buttons">
                <a th:href="@{/oauth2/authorization/google}" class="btn-social btn-google">
                    <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
                        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
                        <path d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
                    </svg>
                    Google로 계속하기
                </a>
                <a th:href="@{/oauth2/authorization/naver}" class="btn-social btn-naver">
                    <span class="naver-n">N</span> Naver로 계속하기
                </a>
            </div>

            <p class="auth-link">처음 방문하셨나요? <a th:href="@{/auth/signup}">회원가입</a></p>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
