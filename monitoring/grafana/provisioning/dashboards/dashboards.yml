apiVersion: 1

providers:
  - name: movierecord
    orgId: 1
    folder: Movierecord
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # 대시보드 JSON 파일이 위치한 컨테이너 내 경로(docker-compose 에서 마운트).
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
