<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>마이 페이지</title>
</head>
<body>
<section>
    <div class="my-page-layout">

        <!-- ===== Left Sidebar ===== -->
        <aside class="my-page-sidebar">
            <nav class="side-nav">
                <a th:href="@{/my-page}"
                   th:class="${activeTab == 'movies'} ? 'side-nav-link active' : 'side-nav-link'">내 기록</a>
                <a th:href="@{/my-page/profile}"
                   th:class="${activeTab == 'profile'} ? 'side-nav-link active' : 'side-nav-link'">내 정보 수정</a>
            </nav>
        </aside>

        <!-- ===== Main Content ===== -->
        <div class="my-page-content">

            <!-- ===== Movies Tab ===== -->
            <div th:if="${activeTab == 'movies'}">
                <div class="toolbar">
                    <h1>내가 쓴 영화 기록</h1>
                    <div class="toolbar-right">
                        <form method="get" th:action="@{/my-page}">
                            <input type="hidden" name="page" value="0">
                            <select class="sort-select" name="sort" onchange="this.form.submit()">
                                <option th:each="opt : ${sortOptions}"
                                        th:value="${opt.code}"
                                        th:text="${opt.label}"
                                        th:selected="${opt.code == currentSort.code}"></option>
                            </select>
                        </form>
                    </div>
                </div>

                <div th:if="${items.isEmpty()}" class="empty-state">
                    아직 기록한 영화가 없습니다. <a th:href="@{/movies/new}">첫 영화를 등록</a>해보세요.
                </div>

                <div th:unless="${items.isEmpty()}" class="movie-grid">
                    <div th:each="item : ${items}"
                         class="movie-card"
                         th:attr="
                            data-id=${item.id},
                            data-title=${item.detail.title},
                            data-watched-date=${#temporals.format(item.detail.watchedDate, 'yyyy-MM-dd')},
                            data-thumbnail-url=${item.detail.thumbnailUrl},
                            data-one-liner=${item.detail.oneLiner},
                            data-immersion=${item.detail.immersion},
                            data-story=${item.detail.story},
                            data-emotion=${item.detail.emotion},
                            data-good-points=${item.detail.goodPoints},
                            data-bad-points=${item.detail.badPoints},
                            data-taste=${item.detail.taste},
                            data-rating=${item.detail.rating},
                            data-nickname=${item.detail.nickname}">
                        <div class="movie-thumb"
                             th:style="${item.thumbnailUrl != null} ? 'background-image:url(' + ${item.thumbnailUrl} + ')' : ''"
                             th:text="${item.thumbnailUrl == null} ? '이미지 없음' : ''"></div>
                        <div class="movie-info">
                            <h3 class="movie-title" th:text="${item.title}"></h3>
                            <div class="movie-meta">
                                <span class="card-rating"
                                      th:text="'★ ' + ${#numbers.formatDecimal(item.rating, 1, 1)}"></span>
                                <span th:text="${#temporals.format(item.watchedDate, 'yyyy-MM-dd')}"></span>
                            </div>
                            <div class="card-nickname" th:if="${item.detail.nickname != null}"
                                 th:text="'by ' + ${item.detail.nickname}"></div>
                        </div>
                    </div>
                </div>

                <nav class="pagination" th:if="${page.totalPages > 1}">
                    <a th:if="${!page.isFirst()}"
                       th:href="@{/my-page(page=${page.number - 1}, sort=${currentSort.code})}">&#8249;</a>
                    <span th:if="${page.isFirst()}" class="disabled">&#8249;</span>

                    <th:block th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
                        <a th:if="${i != page.number}"
                           th:href="@{/my-page(page=${i}, sort=${currentSort.code})}"
                           th:text="${i + 1}"></a>
                        <span th:if="${i == page.number}" class="active" th:text="${i + 1}"></span>
                    </th:block>

                    <a th:if="${!page.isLast()}"
                       th:href="@{/my-page(page=${page.number + 1}, sort=${currentSort.code})}">&#8250;</a>
                    <span th:if="${page.isLast()}" class="disabled">&#8250;</span>
                </nav>

                <!-- Modal -->
                <div id="movieModal" class="modal-overlay" role="dialog" aria-hidden="true">
                    <div class="modal" role="document">
                        <div class="modal-header">
                            <h2 id="modalTitle"></h2>
                            <button type="button" class="modal-close" aria-label="닫기" data-modal-close>&times;</button>
                        </div>
                        <div class="modal-body">
                            <div id="modalThumb" class="modal-thumb"></div>
                            <div class="modal-details">
                                <dl>
                                    <dt>작성자</dt><dd id="modalNickname"></dd>
                                    <dt>감상일</dt><dd id="modalWatchedDate"></dd>
                                    <dt>별점</dt><dd class="rating-display" id="modalRating"></dd>
                                    <dt>한줄평</dt><dd id="modalOneLiner"></dd>
                                    <dt>몰입감</dt><dd id="modalImmersion"></dd>
                                    <dt>스토리</dt><dd id="modalStory"></dd>
                                    <dt>감정</dt><dd id="modalEmotion"></dd>
                                    <dt>좋았던 점</dt><dd id="modalGood"></dd>
                                    <dt>아쉬웠던 점</dt><dd id="modalBad"></dd>
                                    <dt>내 취향</dt><dd id="modalTaste"></dd>
                                </dl>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <form id="modalDeleteForm" method="post" style="display:inline"
                                  onsubmit="return confirm('정말 삭제하시겠습니까?');">
                                <button type="submit" class="btn btn-danger">삭제</button>
                            </form>
                            <a id="modalEditLink" class="btn btn-primary">수정</a>
                            <button type="button" class="btn btn-secondary" data-modal-close>닫기</button>
                        </div>
                    </div>
                </div>

                <script th:src="@{/js/app.js}"></script>
            </div>

            <!-- ===== Profile Tab ===== -->
            <div th:if="${activeTab == 'profile'}">
                <div class="toolbar">
                    <h1>내 정보 수정</h1>
                </div>

                <div th:if="${param.success}" class="alert alert-success">닉네임이 변경되었습니다.</div>

                <div class="profile-card">
                    <p class="current-nickname-label">현재 닉네임: <strong th:text="${currentNickname}"></strong></p>
                    <form method="post" th:action="@{/my-page/profile}" th:object="${nicknameForm}">
                        <div class="form-group">
                            <label for="nickname">새 닉네임</label>
                            <div class="input-row">
                                <input type="text" id="nickname" name="nickname"
                                       th:field="*{nickname}"
                                       placeholder="닉네임 입력 (한글, 영문, 숫자, _)"
                                       class="form-control" autocomplete="off"/>
                                <button type="button" class="btn btn-secondary" onclick="checkNickname()">중복 확인</button>
                            </div>
                            <span th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}" class="field-error"></span>
                            <span id="nicknameCheckResult" class="field-hint"></span>
                        </div>
                        <button type="submit" class="btn btn-primary">저장</button>
                    </form>
                </div>

                <script>
                (function() {
                    function checkNickname() {
                        const input = document.getElementById('nickname');
                        const result = document.getElementById('nicknameCheckResult');
                        const value = input ? input.value.trim() : '';
                        if (!value) {
                            result.textContent = '닉네임을 입력해주세요.';
                            result.className = 'field-hint field-error';
                            return;
                        }
                        fetch('/my-page/check-nickname?nickname=' + encodeURIComponent(value))
                            .then(function(r) { return r.json(); })
                            .then(function(data) {
                                result.textContent = data.message;
                                result.className = data.available ? 'field-hint field-success' : 'field-hint field-error';
                            });
                    }
                    window.checkNickname = checkNickname;

                    const nicknameInput = document.getElementById('nickname');
                    if (nicknameInput) {
                        nicknameInput.addEventListener('input', function() {
                            const result = document.getElementById('nicknameCheckResult');
                            result.textContent = '';
                            result.className = 'field-hint';
                        });
                    }
                })();
                </script>
            </div>

        </div><!-- /.my-page-content -->
    </div><!-- /.my-page-layout -->
</section>
</body>
</html>
