spring.config.import=optional:file:./.env.properties

spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

# MODE=MySQL: Flyway 마이그레이션이 운영(MySQL)과 같은 SQL 로 로컬 H2 에서도 실행되게 한다.
spring.datasource.url=jdbc:h2:file:./data/movierecord;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.cache.type=simple

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 로컬 개발 전용 JWT 시크릿(운영에서는 절대 사용 금지, 환경변수로 주입). http 개발이라 Secure=false.
app.jwt.secret=${APP_JWT_SECRET:local-dev-only-secret-change-me-please-32b+}
app.cookie.secure=false
