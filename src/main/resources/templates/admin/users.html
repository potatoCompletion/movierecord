<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>가입 승인 관리</title>
</head>
<body>
<section>
    <style>
        .admin-container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .admin-title { color: #e8b84b; font-size: 1.5rem; margin-bottom: 1.5rem; }
        .user-table { width: 100%; border-collapse: collapse; }
        .user-table th, .user-table td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(232, 184, 75, 0.1);
            color: #f0ebe0;
        }
        .user-table th { color: rgba(240, 235, 224, 0.5); font-weight: 500; font-size: 0.85rem; }
        .approve-btn {
            background: #e8b84b;
            color: #0c0b18;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .approve-btn:hover { background: #d4a43a; }
        .empty-msg { color: rgba(240, 235, 224, 0.4); padding: 2rem 0; text-align: center; }
    </style>

    <div class="admin-container">
        <h2 class="admin-title">가입 승인 대기 목록</h2>

        <div th:if="${#lists.isEmpty(pendingUsers)}" class="empty-msg">
            승인 대기 중인 회원이 없습니다.
        </div>

        <table th:if="${!#lists.isEmpty(pendingUsers)}" class="user-table">
            <thead>
                <tr>
                    <th>이름</th>
                    <th>아이디</th>
                    <th>가입 일시</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${pendingUsers}">
                    <td th:text="${user.name}"></td>
                    <td th:text="${user.username}"></td>
                    <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <form th:action="@{/admin/users/{id}/approve(id=${user.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="approve-btn">승인</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
