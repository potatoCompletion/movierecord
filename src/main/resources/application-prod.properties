server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis
spring.cache.type=redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# 운영은 https 종단이므로 인증 쿠키에 Secure 플래그를 강제한다.
app.cookie.secure=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.h2.console.enabled=false

app.upload.dir=/app/uploads

# ===== Actuator 관리 포트 분리 =====
# actuator 를 서비스 포트(8080)에서 분리해 9090 으로만 노출한다.
# docker-compose 에서 9090 은 host 로 publish 하지 않고 expose 만 하므로,
# 같은 내부 네트워크의 Prometheus 컨테이너만 app:9090/actuator/prometheus 를 스크레이프할 수 있다.
# nginx 는 app:8080 만 프록시하므로 공개 도메인에서 /actuator/** 는 닿지 않는다.
management.server.port=9090