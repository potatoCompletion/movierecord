<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>로그인</title>
</head>
<body>
<section>
    <style>
        body { background-color: #0c0b18; }
        main.container { padding-top: 0; padding-bottom: 0; }
        .site-header {
            background-color: #100f1c;
            border-bottom: 1px solid rgba(232, 184, 75, 0.1);
        }
        .brand { color: #e8b84b !important; }
        .site-footer {
            background-color: #0c0b18;
            border-top: 1px solid rgba(232, 184, 75, 0.06);
            margin-top: 0;
        }
        .site-footer small { color: rgba(240, 235, 224, 0.2); }
    </style>

    <div class="auth-scene">
        <div class="auth-container">

            <div class="auth-brand">
                <div class="film-icon">🎬</div>
            </div>

            <div class="film-strip">
                <span class="film-hole"></span>
                <span class="film-hole"></span>
                <span class="film-hole"></span>
                <span class="film-hole"></span>
                <span class="film-hole"></span>
                <span class="film-hole"></span>
                <span class="film-hole"></span>
                <span class="film-hole"></span>
            </div>

            <h2 class="auth-title">다시 돌아오셨군요</h2>
            <p class="auth-subtitle">당신의 영화 기록이 기다리고 있어요</p>

            <div th:if="${param.error}" class="flash-message error">
                아이디 또는 비밀번호가 올바르지 않습니다.
            </div>
            <div th:if="${param.disabled}" class="flash-message error">
                승인 대기 상태입니다. 관리자가 가입을 승인할 때까지 기다려주세요.
            </div>
            <div th:if="${param.logout}" class="flash-message">
                로그아웃되었습니다.
            </div>
            <div th:if="${param.signupSuccess}" class="flash-message">
                회원가입 신청이 완료되었습니다. 관리자 승인 후 로그인하실 수 있습니다.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username"
                           class="form-control" autofocus autocomplete="username"
                           placeholder="아이디를 입력하세요">
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password"
                           class="form-control" autocomplete="current-password"
                           placeholder="비밀번호를 입력하세요">
                </div>
                <button type="submit" class="btn btn-primary btn-block">로그인</button>
            </form>

            <div class="social-divider">
                <span>또는 소셜 계정으로 로그인</span>
            </div>

            <div class="social-buttons">
                <a href="/oauth2/authorization/google" class="btn-social btn-google">
                    <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
                        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
                        <path d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
                    </svg>
                    Google로 계속하기
                </a>
                <a href="/oauth2/authorization/naver" class="btn-social btn-naver">
                    <span class="naver-n">N</span>
                    Naver로 계속하기
                </a>
            </div>

            <style>
                .social-divider {
                    display: flex;
                    align-items: center;
                    margin: 1.5rem 0 1.25rem;
                    gap: 0.75rem;
                    color: rgba(240, 235, 224, 0.3);
                    font-size: 0.75rem;
                    letter-spacing: 0.05em;
                }
                .social-divider::before,
                .social-divider::after {
                    content: '';
                    flex: 1;
                    height: 1px;
                    background: rgba(240, 235, 224, 0.1);
                }
                .social-buttons {
                    display: flex;
                    flex-direction: column;
                    gap: 0.625rem;
                }
                .btn-social {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    gap: 0.625rem;
                    padding: 0.7rem 1rem;
                    border-radius: 8px;
                    font-size: 0.875rem;
                    font-weight: 500;
                    text-decoration: none;
                    transition: filter 0.15s ease, transform 0.1s ease;
                    cursor: pointer;
                }
                .btn-social:hover {
                    filter: brightness(1.08);
                    transform: translateY(-1px);
                }
                .btn-social:active {
                    transform: translateY(0);
                }
                .btn-google {
                    background: #ffffff;
                    color: #3c4043;
                }
                .btn-naver {
                    background: #03C75A;
                    color: #ffffff;
                }
                .naver-n {
                    font-weight: 800;
                    font-size: 1rem;
                    line-height: 1;
                }
            </style>

            <p class="auth-link">처음 방문하셨나요? <a th:href="@{/auth/signup}">회원가입</a></p>
        </div>
    </div>
</section>
</body>
</html>
