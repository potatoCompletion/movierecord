limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name mu-ra-bel.com www.mu-ra-bel.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mu-ra-bel.com www.mu-ra-bel.com;

    ssl_certificate /etc/letsencrypt/live/mu-ra-bel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mu-ra-bel.com/privkey.pem;

    limit_conn conn 20;

    # 로그인·회원가입: 무차별 대입 차단
    location ~ ^/(login|auth/(login|signup)) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}