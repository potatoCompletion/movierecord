services:
  app:
    build: .
    container_name: movierecord-app
    restart: always
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
      - "9090"          # actuator 관리 포트 — 내부 네트워크 전용(host publish 안 함)
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./uploads:/app/uploads

  mysql:
    image: mysql:8.4
    container_name: movierecord-mysql
    restart: always
    env_file:
      - .env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:stable
    container_name: movierecord-nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      # HTTPS 붙일 때 사용
      # - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/app/uploads:ro
      - ./docker/certbot/www:/var/www/certbot:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro

  redis:
    image: redis:8.6.3-alpine
    container_name: movie-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: movierecord-prometheus
    restart: always
    depends_on:
      - app
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # 관리용이므로 host 로 열지 않고 로컬 루프백에만 바인딩(SSH 터널로 접근).
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: movierecord-grafana
    restart: always
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # .env 에 GRAFANA_ADMIN_PASSWORD 를 반드시 설정하세요(기본값은 개발 편의용).
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    # 공개하려면 nginx 서브도메인+auth 를 붙이고, 아니면 SSH 터널로 접근.
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
